name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The catalogue (UIG-12) is generated, never written: this rebuilds it
      # from the source and fails if the committed `registry.json` is not what
      # the code produces, or if it does not match its own schema. A registry
      # that can drift from what it describes is worse than none — the skill
      # (UIG-20) and the copy detector (UIG-25) read it and nothing else.
      - name: The registry is current and valid
        run: npm run registry:check

      # The published entry point must not drag React in. Bundling a peer would
      # put a second React in a consuming app, which breaks hooks at runtime and
      # is invisible at build time.
      - name: React stays external to the bundle
        run: |
          if grep -qE "function (useState|useRef|useEffect)\(" dist/index.js; then
            echo "::error::React looks bundled into dist/index.js — it must stay a peer"
            exit 1
          fi

      # Tailwind purges any class it cannot find, so a consumer that does not
      # scan this package renders correct markup at the wrong size, with nothing
      # reporting it. The globs are what make that impossible to forget; if they
      # stop resolving, the failure is silent everywhere else.
      - name: The exported Tailwind content globs resolve to real files
        run: |
          node --input-type=module -e "
            import { globSync } from 'node:fs'
            import { fileURLToPath } from 'node:url'
            // Same two globs tailwind-preset.js exports. They are duplicated here
            // rather than imported because the preset imports tailwindcss/plugin,
            // which bare Node ESM will not resolve — Tailwind's own loader does.
            const own = (g) => fileURLToPath(new URL(g, 'file://' + process.cwd() + '/'))
            for (const g of [own('dist/*.js'), own('src/*.tsx')]) {
              const hits = globSync(g)
              if (hits.length === 0) { console.error('::error::no files match ' + g); process.exit(1) }
              console.log(g, '->', hits.length, 'files')
            }
          "

  # The UI Guardrails' rules pointed inward (UIG-5, as Peek's UIG-3 and Ship's
  # UIG-4): a raw element buried inside a component, behaviour Base UI owns
  # written by hand, a component with no page or no story. `npm run lint:rules`
  # builds the rules first, writes .gates-count.json, and fails on an
  # eslint-disable that switches one of them off. Zero errors on the day this
  # landed, so it stays zero.
  #
  # A job of its own, not a step in `check`, because GitHub can require only a
  # whole job, by its name (UIG-6): branch protection on main requires `gate`.
  # Renaming this job leaves every pull request waiting for a check that never
  # reports.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every step of the gate, as one command (R13, 25 September): the gate
      # lint and its count, the count committed (B2), the token contract
      # (`npm run lint`: no class Tailwind does not generate, no ramp or
      # palette, no raw colour, no plain tailwind-merge), the catalogue, and
      # the wall's own settings (B13): the committed editor hook refuses a raw
      # button, and every folder the gate skips is named in docs/GATES.md.
      # Peek, Ship and every made app run the same command.
      - name: The gate (estiva-gates ci)
        run: npm run gates:ci

      # The usage-page contract, blocking (UIG-19). Every app's gate runs it as
      # `registry:check`; here it ran only in `check`, which merging does not
      # require, so a page that lost its "When not" failed CI and could still
      # merge — proved on 23 September (estiva-ui #78). The package's own pages
      # keep their fuller contract in `src/pages.test.ts`.
      - name: The page contract
        run: npx vitest run --project unit src/pages.test.ts
      # The code under every page's How compiles against the package (R18): a
      # wrong part, prop or value on a page fails here, not in a reader's app.
      - name: The How code compiles
        run: npx vitest run --project unit src/how.test.ts
      # The Claude skill (UIG-20): it names only parts and props the package
      # has, assumes no app, and its Gotchas still add up against the record.
      - name: The skill
        run: npm run skill:check

      # Every story drawn once in Chromium, so a story that throws fails the pull
      # request (Katerina's ruling R19, 25 September). Axe is off in this run
      # (`parameters.a11y.test: 'off'` for this project only): accessibility stays
      # the main-only `a11y` job below. The headless shell is all it needs.
      - name: Chromium, for the stories
        run: npx playwright install --with-deps --only-shell chromium
      - name: Every story draws
        run: npm run test:stories

  # Every story rendered in Chromium and run through axe, once per product
  # theme (vitest.config.ts: the storybook-signal and storybook-ship projects).
  # A story with a violation is a failing test. Its own job, so the browser
  # download runs beside the build rather than after it.
  #
  # On main only, never on a pull request (Katerina, 23 September 2026): it is
  # not required to merge, it is the slowest job, and accessibility is one piece
  # of work for later, all at once.
  a11y:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
