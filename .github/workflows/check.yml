name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The token contract as a machine rule: no class Tailwind does not
      # generate, no Tailwind ramp or palette, no raw colour (eslint.config.js).
      - run: npm run lint
      # The UI Guardrails' rules pointed inward (UIG-5, as Peek's UIG-3 and
      # Ship's UIG-4): a raw element buried inside a component, behaviour Base UI
      # owns written by hand, a component with no page or no story. `npm run
      # lint:rules` builds the rules first, writes .gates-count.json, and fails
      # on an eslint-disable that switches one of them off. Zero errors on the
      # day this landed, so it stays zero.
      - name: Gate lint
        run: npm run lint:rules
      - run: npm test
      - run: npm run build

      # The published entry point must not drag React in. Bundling a peer would
      # put a second React in a consuming app, which breaks hooks at runtime and
      # is invisible at build time.
      - name: React stays external to the bundle
        run: |
          if grep -qE "function (useState|useRef|useEffect)\(" dist/index.js; then
            echo "::error::React looks bundled into dist/index.js — it must stay a peer"
            exit 1
          fi

      # Tailwind purges any class it cannot find, so a consumer that does not
      # scan this package renders correct markup at the wrong size, with nothing
      # reporting it. The globs are what make that impossible to forget; if they
      # stop resolving, the failure is silent everywhere else.
      - name: The exported Tailwind content globs resolve to real files
        run: |
          node --input-type=module -e "
            import { globSync } from 'node:fs'
            import { fileURLToPath } from 'node:url'
            // Same two globs tailwind-preset.js exports. They are duplicated here
            // rather than imported because the preset imports tailwindcss/plugin,
            // which bare Node ESM will not resolve — Tailwind's own loader does.
            const own = (g) => fileURLToPath(new URL(g, 'file://' + process.cwd() + '/'))
            for (const g of [own('dist/*.js'), own('src/*.tsx')]) {
              const hits = globSync(g)
              if (hits.length === 0) { console.error('::error::no files match ' + g); process.exit(1) }
              console.log(g, '->', hits.length, 'files')
            }
          "

  # Every story rendered in Chromium and run through axe, once per product
  # theme (vitest.config.ts: the storybook-signal and storybook-ship projects).
  # A story with a violation is a failing test. Its own job, so the browser
  # download runs beside the build rather than after it.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
